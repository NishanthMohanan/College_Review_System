services:
  mongo:
    image: latest
    container_name: exaltt3-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./college-review-backend
      dockerfile: Dockerfile
    container_name: exaltt3-backend
    env_file:
      - ./college-review-backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    volumes:
      - ./college-review-backend:/app
      - /app/node_modules
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exaltt3-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
